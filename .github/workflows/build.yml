name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle VC++ runtime + package
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in @("VCRUNTIME140.dll","VCRUNTIME140_1.dll","MSVCP140.dll","MSVCP140_1.dll","concrt140.dll","vccorlib140.dll")) {
            $src = Join-Path $env:SystemRoot "System32\$dll"
            $dst = Join-Path $dest $dll
            if ((Test-Path $src) -and -not (Test-Path $dst)) { Copy-Item $src $dst }
          }
          Compress-Archive -Path "$dest\*" -DestinationPath MoshiNovel-Windows.zip -Force
          Get-ChildItem MoshiNovel-Windows.zip | Select-Object Name,Length

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MoshiNovel-Windows.zip
